<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>speech</title>
<link rel="stylesheet" href="shared.css">
<style>
body{display:block}
.pick{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr)}
@media(orientation:portrait),(max-width:640px){.pick{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(.5rem,3vmin,2rem);background:var(--bg);color:var(--tx);text-decoration:none;position:relative;overflow:hidden;transition:background .25s;-webkit-tap-highlight-color:transparent}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,var(--glow),transparent 65%);opacity:0;transition:opacity .3s}
.tile:hover::before,.tile:focus-visible::before,.tile:active::before{opacity:1}
.tile:focus-visible{outline:2px solid var(--glow);outline-offset:-6px}
.code{position:relative;font-size:clamp(4.5rem,24vmin,14rem);font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.arrow{position:relative;width:clamp(2rem,8vmin,4.5rem);height:clamp(2rem,8vmin,4.5rem);color:var(--c2);transition:transform .25s}
.tile:hover .arrow,.tile:focus-visible .arrow{transform:translateX(.6rem)}
.tts{--c1:#7c6af0;--c2:#c084fc;--glow:rgba(124,106,240,.22)}
.stt{--c1:#34d399;--c2:#6af0a8;--glow:rgba(106,240,168,.18)}
.home{position:absolute;top:calc(.75rem + env(safe-area-inset-top));left:.9rem;z-index:2;color:var(--tx3);font-size:.72rem;text-decoration:none;display:flex;align-items:center;gap:3px;padding:.4rem;background:rgba(11,12,16,.7);border-radius:8px}.home:hover{color:var(--tx)}
</style>
</head>
<body>
<a class="home" href="../index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>tools</a>
<div class="pick">
  <a class="tile tts" href="tts.html" aria-label="text to speech">
    <span class="code">tts</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></svg>
  </a>
  <a class="tile stt" href="stt.html" aria-label="speech to text">
    <span class="code">stt</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></svg>
  </a>
</div>
</body>
</html>
