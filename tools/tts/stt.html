<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>speechtext · stt</title>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
.s{gap:.6rem}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:.75rem}
#out{flex:1;min-height:0;width:100%;background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);color:var(--tx);font-family:inherit;font-size:max(16px,1.05rem);padding:1.1rem;resize:none;outline:none;line-height:1.7;transition:border-color .2s}
#out::placeholder{color:var(--tx3)}#out:focus{border-color:var(--ac)}#out:read-only{opacity:.75}
.ctl{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:clamp(.6rem,3vw,1.5rem)}
.side{flex:1;max-width:11rem;min-height:clamp(3.4rem,10vmin,4.5rem);display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--s2);border:1px solid var(--bdr);color:var(--tx);cursor:pointer;font-size:1.05rem;font-weight:600;padding:.6rem 1rem;border-radius:var(--r);transition:all .15s}
.side:hover{border-color:var(--ac)}.side:active{transform:scale(.97)}.side:disabled{opacity:.3;pointer-events:none}.side svg{width:1.6rem;height:1.6rem;flex-shrink:0}
.side.ok{color:var(--grn);border-color:var(--grn)}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.rec{--sz:clamp(4.75rem,16vmin,7.5rem);--lvl:0;position:relative;width:var(--sz);height:var(--sz);border-radius:50%;border:none;background:var(--ac);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s,box-shadow .2s;box-shadow:0 6px 24px rgba(124,106,240,.35)}
.rec:hover{background:var(--ac2)}.rec:active{transform:scale(.96)}
.rec svg{width:42%;height:42%}
.rec .stopi{display:none}
.rec::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--red);opacity:0;transform:scale(calc(1 + var(--lvl)*.55));transition:transform .09s linear,opacity .2s;pointer-events:none}
.rec.on{background:var(--red);box-shadow:0 6px 28px rgba(239,107,107,.4)}
.rec.on::after{opacity:.6}
.rec.on .micoi{display:none}.rec.on .stopi{display:block}
.rec:disabled{opacity:.4;pointer-events:none}
.rec.busy::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid transparent;border-top-color:var(--grn);animation:spin .9s linear infinite}
.timer{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--tx3);min-height:1.1em}
.timer.on{color:var(--red)}
@media(orientation:landscape) and (max-height:480px){
  .screen{max-width:52rem;padding-top:.6rem;padding-bottom:.6rem}
  .main{flex-direction:row}
  .ctl{flex-direction:column;width:10rem;gap:.5rem}
  .recwrap{order:0}
  .side{width:100%;max-width:none;min-height:2.6rem;order:1}
  .rec{--sz:clamp(3.6rem,20vh,5rem)}
}
</style>
</head>
<body>
<div class="screen s active">
  <div class="topbar">
    <a class="bback" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Back</a>
    <div class="title sm">speech to text</div>
    <div class="tbar-r"><button class="ibtn" id="bGear" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button></div>
  </div>
  <div class="drawer" id="drawer">
    <label for="lang">Language</label>
    <select id="lang"></select>
    <label for="quality">Model</label>
    <select id="quality"></select>
    <div class="hint" id="qHint"></div>
  </div>
  <div class="pbar-wrap" id="mBar">
    <div class="pbar-fill" id="mFill"></div>
    <div class="pbar-inner"><span id="mTxt">Loading speech model…</span><span class="pbar-pct" id="mPct">0%</span></div>
  </div>
  <div class="main">
    <textarea id="out" placeholder="Press the mic and talk. Words appear live as you speak." spellcheck="false"></textarea>
    <div class="ctl">
      <button class="side" id="bClear" title="Clear / reset" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg><span>Clear</span></button>
      <div class="recwrap">
        <button class="rec" id="rec" title="Record" aria-label="Start / stop recording">
          <svg class="micoi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
          <svg class="stopi" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
        </button>
        <div class="timer" id="timer">0:00</div>
      </div>
      <button class="side" id="bCopy" title="Copy" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg><span id="copyLbl">Copy</span></button>
    </div>
  </div>
  <div class="stat" id="stat">Ready</div>
</div>

<script type="module">
import{$,fmt,setStat,barSetter,store,copyText,wireGear}from'./shared.js';
const out=$('out'),rec=$('rec'),timer=$('timer'),stat=$('stat'),bCopy=$('bCopy'),bClear=$('bClear'),copyLbl=$('copyLbl'),
langSel=$('lang'),qSel=$('quality'),qHint=$('qHint'),mBar=$('mBar');
const setMP=barSetter($('mFill'),$('mPct'),$('mTxt'));
const setSt=(m,t='')=>setStat(stat,m,t);
wireGear($('bGear'),$('drawer'));

// ---- settings ----
const LANGS=[['english','English'],['auto','Auto-detect'],['afrikaans','Afrikaans'],['arabic','العربية · Arabic'],['bengali','বাংলা · Bengali'],['bulgarian','Български · Bulgarian'],['catalan','Català · Catalan'],['chinese','中文 · Chinese'],['croatian','Hrvatski · Croatian'],['czech','Čeština · Czech'],['danish','Dansk · Danish'],['dutch','Nederlands · Dutch'],['estonian','Eesti · Estonian'],['finnish','Suomi · Finnish'],['french','Français · French'],['german','Deutsch · German'],['greek','Ελληνικά · Greek'],['hebrew','עברית · Hebrew'],['hindi','हिन्दी · Hindi'],['hungarian','Magyar · Hungarian'],['icelandic','Íslenska · Icelandic'],['indonesian','Indonesia · Indonesian'],['italian','Italiano · Italian'],['japanese','日本語 · Japanese'],['korean','한국어 · Korean'],['latvian','Latviešu · Latvian'],['lithuanian','Lietuvių · Lithuanian'],['malay','Melayu · Malay'],['norwegian','Norsk · Norwegian'],['persian','فارسی · Persian'],['polish','Polski · Polish'],['portuguese','Português · Portuguese'],['romanian','Română · Romanian'],['russian','Русский · Russian'],['serbian','Српски · Serbian'],['slovak','Slovenčina · Slovak'],['slovenian','Slovenščina · Slovenian'],['spanish','Español · Spanish'],['swahili','Kiswahili · Swahili'],['swedish','Svenska · Swedish'],['tagalog','Tagalog'],['tamil','தமிழ் · Tamil'],['thai','ไทย · Thai'],['turkish','Türkçe · Turkish'],['ukrainian','Українська · Ukrainian'],['urdu','اردو · Urdu'],['vietnamese','Tiếng Việt · Vietnamese'],['welsh','Cymraeg · Welsh']];
langSel.innerHTML=LANGS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
const savedLang=store.get('stt.lang','english');
langSel.value=LANGS.some(l=>l[0]===savedLang)?savedLang:'english';
langSel.addEventListener('change',()=>store.set('stt.lang',langSel.value));

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition,hasGPU=!!navigator.gpu;
const QUAL=[['fast','Fast · ~80 MB','Smallest download, runs on any phone. Least accurate.'],
            ['good','Balanced · ~250 MB','Good accuracy, runs on any device. Recommended.']];
if(SRC)QUAL.unshift(['live','Instant live · browser','Truly live, words appear as you speak. Uses your browser\'s built-in speech engine (Chrome/Edge/Safari), which may send audio to the browser vendor. Offline Whisper models below process in small delayed bursts.']);
if(hasGPU)QUAL.push(['best','Best · ~1.6 GB (GPU)','Highest accuracy (Whisper large-v3-turbo). Big one-time download, needs a fast GPU browser; falls back to Balanced if it fails.']);
qSel.innerHTML=QUAL.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
const savedQ=store.get('stt.quality',SRC?'live':'good');
qSel.value=QUAL.some(q=>q[0]===savedQ)?savedQ:QUAL[0][0];
const showHint=()=>{qHint.textContent=QUAL.find(q=>q[0]===qSel.value)[2]};showHint();

// ---- model worker ----
let worker=null,ready=false,readyRes=null,readyPromise=null,modelErr=null,curModel=null;
function newReady(){ready=false;modelErr=null;readyPromise=new Promise(r=>readyRes=r)}
function loadModel(key){
  curModel=key;newReady();
  mBar.classList.remove('done');setMP(1,'Loading speech model…');
  worker.postMessage({type:'load',model:key});
}
try{
  worker=new Worker('stt-worker.js',{type:'module'});
}catch(e){modelErr=e.message;setMP(0,'Failed: '+e.message);}
let job=null; // {id,gen,text,resolve}
if(worker){
  newReady();
  worker.onerror=e=>{const m=e.message||'worker failed to start';modelErr=m;setMP(0,'Failed: '+m);setSt('Speech engine failed: '+m,'err');readyRes&&readyRes();fail()};
  worker.onmessage=e=>{
    const m=e.data;
    if(m.type==='progress')setMP(m.pct,m.text);
    else if(m.type==='ready'){ready=true;setMP(100,'Speech model ready ✓');setTimeout(()=>mBar.classList.add('done'),1400);readyRes();}
    else if(m.type==='partial'&&job&&m.id===job.id){if(m.text)job.text+=(job.text?' ':'')+m.text}
    else if(m.type==='done'&&job&&m.id===job.id){const j=job;job=null;j.resolve(j.text)}
    else if(m.type==='error'){
      console.error('stt worker:',m.message);
      if(m.where==='load'){
        if(curModel==='best'){ // gpu path failed → safe wasm model
          qSel.value='good';setSt('GPU model failed, using Balanced','err');loadModel('good');
        }else{modelErr=m.message;setMP(0,'Failed: '+m.message);readyRes();}
      }else{setSt('Transcription failed: '+m.message,'err');fail()}
    }
  };
  const pick=()=>{if(qSel.value==='live'){mBar.classList.add('done');curModel='live'}else loadModel(qSel.value)};
  pick();
  qSel.addEventListener('change',()=>{store.set('stt.quality',qSel.value);showHint();if(!recording)pick();else qSel.value=curModel});
}
function fail(){if(job){const j=job;job=null;j.resolve('')}}
function runPass(audio){ // one whisper pass over a copy of audio → text
  return new Promise(resolve=>{
    job={id:++jobSeq,text:'',resolve};
    worker.postMessage({type:'transcribe',id:job.id,audio,lang:langSel.value},[audio.buffer]);
  });
}
let jobSeq=0;

// ---- ui state ----
let recording=false,finishing=false;
function sync(){bCopy.disabled=!out.value.trim();bClear.disabled=!out.value.trim()&&!recording}
out.addEventListener('input',sync);
bClear.addEventListener('click',()=>{ // full reset, also mid-recording
  gen++;committed='';base='';seg=new Float32Array(0);
  out.value='';sync();setSt(recording?'Listening…':'Ready',recording?'on':'');if(!recording)out.focus();
});
let copyT=null;
bCopy.addEventListener('click',async()=>{
  const ok=await copyText(out.value);
  bCopy.classList.toggle('ok',ok);copyLbl.textContent=ok?'Copied':'Failed';
  if(!ok){out.focus();out.select()}
  clearTimeout(copyT);copyT=setTimeout(()=>{bCopy.classList.remove('ok');copyLbl.textContent='Copy'},1600);
});

// ---- capture (raw PCM via AudioWorklet, ScriptProcessor fallback; resampled to 16 kHz mono) ----
class Resampler{ // streaming box-average downsampler
  constructor(inRate,outRate){this.r=inRate/outRate;this.pos=0;this.tail=new Float32Array(0);this.same=inRate===outRate}
  process(x){
    if(this.same)return x.slice();
    const buf=new Float32Array(this.tail.length+x.length);buf.set(this.tail);buf.set(x,this.tail.length);
    const o=[];let p=this.pos;
    while(p+this.r<=buf.length){
      const a=Math.floor(p),b=Math.max(a+1,Math.round(p+this.r));let s=0;
      for(let i=a;i<b;i++)s+=buf[i];o.push(s/(b-a));p+=this.r;
    }
    const k=Math.floor(p);this.tail=buf.slice(k);this.pos=p-k;
    return Float32Array.from(o);
  }
}
let ctx=null,stream=null,node=null,mute=null,src=null,rs=null,t0=0,tick=null;
let seg=new Float32Array(0),committed='',base='',gen=0; // seg = audio not yet committed to text

function onBlock(block){
  let e=0;for(let i=0;i<block.length;i+=4)e+=block[i]*block[i];
  rec.style.setProperty('--lvl',Math.min(1,Math.sqrt(e/(block.length/4))*6).toFixed(2));
  const r=rs.process(block);
  if(r.length){const n=new Float32Array(seg.length+r.length);n.set(seg);n.set(r,seg.length);seg=n}
}
const SR=16000,FORCE=22*SR;
const rmsOf=(a,from,to)=>{let s=0;for(let i=from;i<to;i++)s+=a[i]*a[i];return Math.sqrt(s/Math.max(1,to-from))};
function show(tent){
  const body=(committed+(tent?(committed?' ':'')+tent:'')).trim();
  out.value=(base&&body?base+'\n\n':base)+body;out.scrollTop=out.scrollHeight;sync();
}
// live loop: repeatedly transcribe the uncommitted audio; commit on a pause or when the window gets long
async function liveLoop(){
  let last=0;
  while(recording){
    if(seg.length<SR*.6||seg.length===last){await new Promise(r=>setTimeout(r,120));continue}
    const g=gen,n=seg.length,snap=seg.slice(0,n);last=n;
    const speech=rmsOf(snap,0,n)>0.004;
    const text=speech?await runPass(snap):'';
    if(g!==gen)continue; // cleared meanwhile
    show(text);
    const quiet=seg.length-n<SR*.2&&n>=SR*1.5&&rmsOf(seg,Math.max(0,n-SR*.8),n)<0.004; // paused after speech
    if(text&&(quiet||n>=FORCE)||(!speech&&n>=SR*3)){committed=(committed+(text&&committed?' ':'')+text).trim();seg=seg.slice(n);last=0;show('')}
    else if(!speech&&seg.length>SR*6)seg=seg.slice(seg.length-SR*2),last=0;
  }
}
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setSt('Microphone needs https or localhost','err');return}
  if(qSel.value==='live')return startSR();
  if(!ready){setSt('Waiting for speech model…');await readyPromise}
  if(modelErr||!ready){setSt('Speech model failed to load','err');return}
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();ctx.resume&&ctx.resume();
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    ctx.close();ctx=null;
    setSt(e.name==='NotAllowedError'?'Microphone blocked, allow it in the browser':e.name==='NotFoundError'?'No microphone found':'Mic error: '+e.message,'err');return;
  }
  if(ctx.state!=='running')await ctx.resume();
  rs=new Resampler(ctx.sampleRate,16000);seg=new Float32Array(0);committed='';gen++;
  base=out.value.replace(/\s+$/,'');
  src=ctx.createMediaStreamSource(stream);
  mute=ctx.createGain();mute.gain.value=0;mute.connect(ctx.destination);
  let ok=false;
  if(ctx.audioWorklet){
    try{
      await Promise.race([ctx.audioWorklet.addModule('cap-worklet.js'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('addModule timeout')),2500))]);
      node=new AudioWorkletNode(ctx,'cap',{numberOfInputs:1,numberOfOutputs:1,channelCount:1,channelCountMode:'explicit'});
      node.port.onmessage=e=>onBlock(e.data);ok=true;
    }catch(e){console.warn('worklet failed, using ScriptProcessor',e)}
  }
  if(!ok){
    node=ctx.createScriptProcessor(4096,1,1);
    node.onaudioprocess=e=>onBlock(new Float32Array(e.inputBuffer.getChannelData(0)));ok=true;
  }
  src.connect(node);node.connect(mute);
  recording=true;out.readOnly=true;rec.classList.add('on');timer.classList.add('on');sync();
  t0=performance.now();timer.textContent='0:00';
  tick=setInterval(()=>{timer.textContent=fmt((performance.now()-t0)/1000)},250);
  setSt('Listening… words appear live','on');
  liveLoop();
}
const SRL={english:'en-US',spanish:'es-ES',french:'fr-FR',german:'de-DE',italian:'it-IT',portuguese:'pt-BR',russian:'ru-RU',chinese:'zh-CN',japanese:'ja-JP',korean:'ko-KR',arabic:'ar-SA',hindi:'hi-IN',dutch:'nl-NL',polish:'pl-PL',turkish:'tr-TR',swedish:'sv-SE',ukrainian:'uk-UA',hebrew:'he-IL',indonesian:'id-ID',vietnamese:'vi-VN',thai:'th-TH',greek:'el-GR',czech:'cs-CZ',danish:'da-DK',finnish:'fi-FI',norwegian:'nb-NO',hungarian:'hu-HU',romanian:'ro-RO'};
let sr=null,srSess='';
function startSR(){
  gen++;committed='';srSess='';base=out.value.replace(/\s+$/,'');
  const mk=()=>{
    sr=new SRC();sr.continuous=true;sr.interimResults=true;
    sr.lang=SRL[langSel.value]||navigator.language||'en-US';
    sr.onresult=e=>{
      let fin='',int='';
      for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else int+=t}
      srSess=fin.trim();show((srSess+' '+int.trim()).trim());
    };
    sr.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){setSt('Microphone blocked, allow it in the browser','err');recording=false;endSR()}else if(e.error!=='no-speech'&&e.error!=='aborted')setSt('Speech error: '+e.error,'err')};
    sr.onend=()=>{ // browser ends sessions on silence → bank text and restart
      if(srSess){committed=(committed+(committed?' ':'')+srSess).trim();srSess=''}
      if(recording){try{mk()}catch(_){endSR()}}
    };
    sr.start();
  };
  try{mk()}catch(e){setSt('Speech start failed: '+e.message,'err');return}
  recording=true;out.readOnly=true;rec.classList.add('on');timer.classList.add('on');sync();
  t0=performance.now();timer.textContent='0:00';
  tick=setInterval(()=>{timer.textContent=fmt((performance.now()-t0)/1000)},250);
  setSt('Listening… words appear live','on');
}
function endSR(){
  recording=false;clearInterval(tick);rec.classList.remove('on');timer.classList.remove('on');
  out.readOnly=false;show('');sync();
  setSt(out.value.trim()?'Done ✓':'No speech heard',out.value.trim()?'on':'');
}
async function stopRec(){
  if(sr){const s0=sr;sr=null;recording=false;s0.onend=null;try{s0.stop()}catch(_){}
    if(srSess){committed=(committed+(committed?' ':'')+srSess).trim();srSess=''}
    return endSR()}
  recording=false;finishing=true;clearInterval(tick);
  rec.classList.remove('on');timer.classList.remove('on');rec.style.setProperty('--lvl',0);
  try{node.disconnect();src.disconnect();mute.disconnect()}catch(e){}
  if(node.port)node.port.onmessage=null;
  stream.getTracks().forEach(t=>t.stop());
  await ctx.close().catch(()=>{});ctx=null;
  rec.disabled=true;rec.classList.add('busy');setSt('Finishing…');
  while(job)await new Promise(r=>setTimeout(r,60)); // let the in-flight pass end
  if(seg.length>=SR*.4&&rmsOf(seg,0,seg.length)>0.004){
    const g=gen,t=await runPass(seg.slice(0));
    if(g===gen){committed=(committed+(t&&committed?' ':'')+t).trim()}
  }
  seg=new Float32Array(0);show('');
  rec.disabled=false;rec.classList.remove('busy');out.readOnly=false;finishing=false;sync();
  setSt(out.value.trim()?'Done ✓':'No speech heard',out.value.trim()?'on':'');
}
let starting=false;
rec.addEventListener('click',async()=>{
  if(finishing||starting)return;
  if(recording)return stopRec();
  starting=true;try{await startRec()}finally{starting=false}
});
sync();
</script>
</body>
</html>
