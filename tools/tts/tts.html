<style>

<div class="s2-inner">

  <div class="topbar">
    <button class="bback" id="bBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Back</button>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script type="module">
import{$,esc,fmt,setStat,barSetter,wireGear}from'./shared.js';
const s1=$('s1'),s2=$('s2'),ti=$('textInput'),charCt=$('charCt'),
dropZone=$('dropZone'),fileIn=$('fileIn'),fpill=$('fpill'),fName=$('fName'),fClear=$('fClear'),pmsg=$('pmsg'),
btnGo=$('btnGo'),bBack=$('bBack'),bGear=$('bGear'),bDl=$('bDl'),drawer=$('drawer'),
vSel=$('voiceSel'),spdR=$('spdR'),spdVal=$('spdVal'),
rpane=$('rpane'),pfill=$('pfill'),pbar=$('pbar'),tE=$('tE'),tT=$('tT'),
cP=$('cP'),cS=$('cS'),cR=$('cR'),cB=$('cB'),cF=$('cF'),iP=$('iP'),iPa=$('iPa'),
stat=$('stat'),ov=$('ov'),ovTxt=$('ovTxt'),ovFill=$('ovFill'),ovPct=$('ovPct'),
mBar=$('mBar'),mFill=$('mFill'),mTxt=$('mTxt'),mPct=$('mPct');

const audioEl=new Audio();
let wavBlob=null,rawSamples=null,rawSr=24000,words=[],wordTimes=[],rafId=null,tts=null,curVoice=null;
let modelReady=false,modelError=null;

const setMP=barSetter(mFill,mPct,mTxt),setGP=barSetter(ovFill,ovPct,ovTxt);
const setSt=(m,t='')=>setStat(stat,m,t);

// ---- Preload model on page open (deferred so textarea stays snappy) ----
let KokoroTTS=null;
setTimeout(async()=>{
  try{
    setMP(2,'Loading voice engine…');
    const mod=await import('https://esm.sh/kokoro-js');
    KokoroTTS=mod.KokoroTTS;

    setMP(10,'Downloading voice model…');
    const cores=navigator.hardwareConcurrency||4;
    console.log(`[TTS] ${cores} CPU cores detected`);
    console.log('[TTS] For max speed, add these HTTP headers to your server:');
    console.log('  Cross-Origin-Opener-Policy: same-origin');
    console.log('  Cross-Origin-Embedder-Policy: credentialless');

    tts=await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{
      dtype:'q8',
      device:'wasm',
      progress_callback:p=>{
        if(p.progress!=null){
          const pct=10+p.progress*0.88;
          const fn=p.file?p.file.split('/').pop():'';
          setMP(pct,fn?'Downloading '+fn:'Downloading…');
        }
      }
    });
    setMP(100,'Voice model ready ✓');
    modelReady=true;
    setTimeout(()=>mBar.classList.add('done'),1400);
  }catch(e){
    console.error('Model load error:',e);
    modelError=e.message;
    mFill.style.width='0%';mPct.textContent='';
    mTxt.textContent='Failed: '+e.message;
  }
},100);

// ---- File handling (runs on main thread, never blocked) ----
ti.addEventListener('input',()=>{const l=ti.value.length;charCt.textContent=l?l.toLocaleString()+' chars':'';btnGo.disabled=!ti.value.trim()});
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)hFile(e.dataTransfer.files[0])});
fileIn.addEventListener('change',e=>{if(e.target.files.length)hFile(e.target.files[0])});
fClear.addEventListener('click',()=>{fpill.classList.remove('show');fileIn.value=''});
async function hFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(!['txt','pdf','docx'].includes(ext))return;
  fName.textContent=f.name;fpill.classList.add('show');pmsg.classList.add('show');
  try{
    let t='';
    if(ext==='txt')t=await f.text();
    else if(ext==='pdf'){const b=await f.arrayBuffer(),p=await pdfjsLib.getDocument({data:b}).promise;for(let i=1;i<=p.numPages;i++){const pg=await p.getPage(i),c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}t=t.trim()}
    else{const b=await f.arrayBuffer(),r=await mammoth.extractRawText({arrayBuffer:b});t=r.value.trim()}
    ti.value=t;ti.dispatchEvent(new Event('input'));
  }catch(e){}
  pmsg.classList.remove('show');
}

// ---- Nav ----
btnGo.addEventListener('click',async()=>{
  s1.classList.remove('active');s2.classList.add('active');
  ov.classList.add('show');setGP(0,'Preparing…');
  if(modelError){setGP(0,'Model failed: '+modelError);return}
  if(!modelReady){
    setGP(0,'Waiting for model to finish loading…');
    while(!modelReady&&!modelError)await new Promise(r=>setTimeout(r,200));
    if(modelError){setGP(0,'Model failed: '+modelError);return}
  }
  await initPlayer();
});
bBack.addEventListener('click',()=>{audioEl.pause();audioEl.src='';cancelAnimationFrame(rafId);s2.classList.remove('active');s1.classList.add('active')});
wireGear(bGear,drawer);
spdR.addEventListener('input',()=>{const v=parseFloat(spdR.value);spdVal.textContent=v.toFixed(1)+'×';audioEl.playbackRate=v});

// ---- Chunk text robustly (never drops anything) ----
function chunkText(text,maxLen){
  const chunks=[];
  const parts=[];
  let last=0;
  const sre=/[.!?\n]+[\s]*/g;
  let m;
  while((m=sre.exec(text))!==null){parts.push(text.slice(last,sre.lastIndex));last=sre.lastIndex}
  const tail=text.slice(last).trim();
  if(tail)parts.push(tail);
  if(!parts.length)parts.push(text);

  let buf='';
  parts.forEach(p=>{
    if((buf+p).length>maxLen&&buf.trim()){chunks.push(buf.trim());buf=p}
    else buf+=p;
  });
  if(buf.trim())chunks.push(buf.trim());
  return chunks;
}

// ---- Generate audio with real % progress ----
async function generateAudio(text,voice){
  // Use ~150 char chunks for granular progress + better model output
  const chunks=chunkText(text,250);
  const allSamples=[];
  let sr=24000;

  for(let i=0;i<chunks.length;i++){
    const pct=Math.round((i/chunks.length)*100);
    setGP(pct,`Generating speech… chunk ${i+1} of ${chunks.length}`);
    // Yield + force repaint so bar actually renders before next chunk blocks thread
    await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,50)));

    const result=await tts.generate(chunks[i],{voice});
    sr=result.sampling_rate;
    const samples=result.audio instanceof Float32Array?result.audio:new Float32Array(result.audio);
    allSamples.push(samples);
    // Tiny silence between chunks
    if(i<chunks.length-1)allSamples.push(new Float32Array(Math.floor(sr*0.15)));
  }
  setGP(100,'Finalizing…');

  const total=allSamples.reduce((a,b)=>a+b.length,0);
  const merged=new Float32Array(total);
  let off=0;
  allSamples.forEach(s=>{merged.set(s,off);off+=s.length});
  return{samples:merged,sampleRate:sr};
}

// ---- Float32 → WAV ----
function toWav(samples,sr){
  const buf=new ArrayBuffer(44+samples.length*2);
  const v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');
  w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,samples.length*2,true);
  for(let i=0;i<samples.length;i++){
    const s=Math.max(-1,Math.min(1,samples[i]));
    v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);
  }
  return new Blob([buf],{type:'audio/wav'});
}

// ---- WSOLA time-stretch (preserves pitch) ----
function timeStretch(input,speed){
  if(Math.abs(speed-1)<0.01)return input;
  const WIN=2048,HALF=WIN>>1,SEARCH=128;
  const outLen=Math.ceil(input.length/speed);
  const out=new Float32Array(outLen);
  const hann=new Float32Array(WIN);
  for(let i=0;i<WIN;i++)hann[i]=0.5*(1-Math.cos(2*Math.PI*i/WIN));
  let inPos=0,outPos=0;
  while(outPos<outLen-WIN){
    let bestOff=0,bestCorr=-Infinity;
    const target=Math.round(inPos);
    if(outPos>0){
      for(let off=-SEARCH;off<=SEARCH;off++){
        const idx=target+off;
        if(idx<0||idx+WIN>input.length)continue;
        let corr=0;
        for(let i=0;i<HALF;i+=4)corr+=out[outPos+i]*input[idx+i];
        if(corr>bestCorr){bestCorr=corr;bestOff=off}
      }
    }
    const src=Math.max(0,Math.min(target+bestOff,input.length-WIN));
    for(let i=0;i<WIN;i++){if(outPos+i<outLen)out[outPos+i]+=input[src+i]*hann[i]}
    outPos+=HALF;inPos+=HALF*speed;
  }
  let mx=0;
  for(let i=0;i<out.length;i++)if(Math.abs(out[i])>mx)mx=Math.abs(out[i]);
  if(mx>0.01){const sc=0.95/mx;for(let i=0;i<out.length;i++)out[i]*=sc}
  return out;
}

// ---- Player init ----
async function initPlayer(){
  const raw=ti.value.trim();
  words=[];const re=/\S+/g;let m;
  while((m=re.exec(raw))!==null)words.push({t:m[0],s:m.index});
  rpane.innerHTML=words.map((w,i)=>`<span class="w" data-i="${i}">${esc(w.t)} </span>`).join('');
  pfill.style.width='0%';tE.textContent='0:00';tT.textContent='0:00';
  iP.style.display='block';iPa.style.display='none';

  const voice=vSel.value;curVoice=voice;
  try{
    const{samples,sampleRate}=await generateAudio(raw,voice);
    rawSamples=samples;rawSr=sampleRate;
    wavBlob=toWav(samples,sampleRate);
    audioEl.src=URL.createObjectURL(wavBlob);
    audioEl.playbackRate=parseFloat(spdR.value);
    audioEl.load();
    audioEl.onloadedmetadata=()=>{calcWordTimes(audioEl.duration);tT.textContent=fmt(audioEl.duration)};
    ov.classList.remove('show');
    setSt('Ready');
  }catch(e){
    console.error('TTS generate error:',e);
    setGP(0,'Failed: '+e.message);
  }
}

// ---- Word timing ----
function calcWordTimes(dur){
  wordTimes=[];
  const totalChars=words.reduce((a,w)=>a+w.t.length+1,0);
  let t=0;
  words.forEach(w=>{const d=(w.t.length+1)/totalChars*dur;wordTimes.push({start:t,end:t+d});t+=d});
}

// ---- Grey-out loop (no highlight, just fade read words) ----
function hlLoop(){
  if(audioEl.paused&&!audioEl.ended)return;
  const ct=audioEl.currentTime;
  let cur=-1;
  for(let i=wordTimes.length-1;i>=0;i--){if(ct>=wordTimes[i].start){cur=i;break}}
  if(cur>=0){
    for(let i=0;i<=cur;i++){const el=rpane.querySelector(`[data-i="${i}"]`);if(el&&!el.classList.contains('spent'))el.classList.add('spent')}
    // Auto-scroll to keep reading position visible
    const last=rpane.querySelector(`[data-i="${cur}"]`);
    if(last){const r=last.getBoundingClientRect(),p=rpane.getBoundingClientRect();if(r.bottom>p.bottom-30||r.top<p.top+30)last.scrollIntoView({block:'center',behavior:'smooth'})}
  }
  rafId=requestAnimationFrame(hlLoop);
}
function clrHL(){rpane.querySelectorAll('.w.spent').forEach(e=>e.classList.remove('spent'))}

// ---- Audio events ----
audioEl.addEventListener('timeupdate',()=>{if(!audioEl.duration)return;pfill.style.width=(audioEl.currentTime/audioEl.duration*100)+'%';tE.textContent=fmt(audioEl.currentTime);tT.textContent=fmt(audioEl.duration)});
audioEl.addEventListener('ended',()=>{iP.style.display='block';iPa.style.display='none';cancelAnimationFrame(rafId);setSt('Done')});

// ---- Controls ----
cP.addEventListener('click',()=>{
  if(!audioEl.src||!wavBlob)return;
  if(audioEl.paused){audioEl.play();iP.style.display='none';iPa.style.display='block';setSt('Playing','on');rafId=requestAnimationFrame(hlLoop)}
  else{audioEl.pause();iP.style.display='block';iPa.style.display='none';cancelAnimationFrame(rafId);setSt('Paused')}
});
cS.addEventListener('click',()=>{audioEl.pause();audioEl.currentTime=0;iP.style.display='block';iPa.style.display='none';pfill.style.width='0%';tE.textContent='0:00';cancelAnimationFrame(rafId);clrHL();setSt('Ready')});
cR.addEventListener('click',()=>{audioEl.currentTime=0;clrHL();if(audioEl.paused){audioEl.play();iP.style.display='none';iPa.style.display='block';setSt('Playing','on');rafId=requestAnimationFrame(hlLoop)}});
cB.addEventListener('click',()=>{audioEl.currentTime=Math.max(0,audioEl.currentTime-10)});
cF.addEventListener('click',()=>{if(audioEl.duration)audioEl.currentTime=Math.min(audioEl.duration,audioEl.currentTime+10)});
pbar.addEventListener('click',e=>{if(!audioEl.duration)return;const p=(e.clientX-pbar.getBoundingClientRect().left)/pbar.offsetWidth;audioEl.currentTime=p*audioEl.duration;clrHL()});
vSel.addEventListener('change',async()=>{
  if(!tts||vSel.value===curVoice)return;
  audioEl.pause();ov.classList.add('show');setGP(0,'Regenerating…');
  await initPlayer();
});
bDl.addEventListener('click',()=>{
  if(!rawSamples||!rawSamples.length){setSt('No audio yet','err');return}
  setSt('Preparing download…');
  try{
    const speed=parseFloat(spdR.value);
    const samples=(Math.abs(speed-1)<0.05)?rawSamples:timeStretch(rawSamples,speed);
    const dlBlob=toWav(samples,rawSr);
    const d=new Date();
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let fname='text to speech '+ds;
    if(Math.abs(speed-1)>0.05)fname+=' '+speed.toFixed(1)+'x';
    fname+='.wav';
    const reader=new FileReader();
    reader.onloadend=()=>{
      const a=document.createElement('a');
      a.href=reader.result;
      a.download=fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>a.remove(),5000);
      setSt('Downloaded ✓','on');
    };
    reader.onerror=()=>setSt('Download failed','err');
    reader.readAsDataURL(dlBlob);
  }catch(e){
    console.error('Download error:',e);
    setSt('Download failed: '+e.message,'err');
  }
});
</script>
</body>
</html>
